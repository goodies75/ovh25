<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test PIN - Comics d'Olivier</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .test-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .input-group {
      margin: 20px 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      letter-spacing: 2px;
    }

    button {
      background: #4F46E5;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px;
      transition: background 0.3s;
    }

    button:hover {
      background: #3F36C5;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-weight: bold;
    }

    .success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
    }

    .info {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3b82f6;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .test-buttons {
      text-align: center;
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <div class="test-container">
    <h1>🔒 Test du Code PIN</h1>

    <div class="input-group">
      <label for="pinInput">Entrez votre code PIN :</label>
      <input type="password" id="pinInput" maxlength="6" placeholder="@••••@">
    </div>

    <div class="test-buttons">
      <button onclick="testPin()">🔍 Tester le PIN</button>
      <button onclick="testAPI()">🔌 Tester l'API</button>
      <button onclick="testCurrentPins()">📋 Tester PINs connus</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    async function testPin() {
      const pin = document.getElementById('pinInput').value;
      const resultDiv = document.getElementById('result');

      if (!pin) {
        showResult('Veuillez entrer un code PIN', 'error');
        return;
      }

      showResult('Test en cours...', 'info');

      try {
        const response = await fetch('./api/validate-pin.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ pin: pin })
        });

        const result = await response.json();

        if (result.success) {
          showResult(`✅ PIN "${pin}" ACCEPTÉ ! Authentification réussie.`, 'success');
        } else {
          showResult(`❌ PIN "${pin}" REFUSÉ. ${result.error || result.message || 'Code incorrect'}`, 'error');
        }

        console.log('Réponse API complète:', result);

      } catch (error) {
        showResult(`❌ Erreur de connexion: ${error.message}`, 'error');
        console.error('Erreur:', error);
      }
    }

    async function testAPI() {
      const resultDiv = document.getElementById('result');
      showResult('Test de l\'API en cours...', 'info');

      try {
        const response = await fetch('./api/validate-pin.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ pin: 'test' })
        });

        if (response.ok) {
          const result = await response.json();
          showResult('✅ API accessible et fonctionnelle', 'success');
          console.log('Test API:', result);
        } else {
          showResult(`❌ Erreur HTTP: ${response.status}`, 'error');
        }
      } catch (error) {
        showResult(`❌ API inaccessible: ${error.message}`, 'error');
      }
    }

    async function testCurrentPins() {
      const resultDiv = document.getElementById('result');
      const pinsToTest = ['@0149@', '1234', '2025', '0000'];

      showResult('Test des PINs connus en cours...', 'info');

      let results = [];

      for (let pin of pinsToTest) {
        try {
          const response = await fetch('./api/validate-pin.php', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ pin: pin })
          });

          const result = await response.json();

          if (result.success) {
            results.push(`✅ "${pin}" - VALIDE`);
          } else {
            results.push(`❌ "${pin}" - ${result.error || 'invalide'}`);
          }
        } catch (error) {
          results.push(`❌ "${pin}" - Erreur: ${error.message}`);
        }
      }

      showResult('Résultats des tests:<br>' + results.join('<br>'), 'info');
    }

    function showResult(message, type) {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = message;
      resultDiv.className = `result ${type}`;
    }

    // Test au chargement de la page
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('pinInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
          testPin();
        }
      });
    });
  </script>
</body>

</html>
