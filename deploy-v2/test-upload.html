<!DOCTYPE html>
<html>

<head>
  <title>Test Upload Simple</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    .container {
      max-width: 600px;
    }

    button {
      padding: 10px 20px;
      margin: 10px 5px;
      background: #007cba;
      color: white;
      border: none;
      cursor: pointer;
    }

    .result {
      background: #f5f5f5;
      padding: 15px;
      margin: 10px 0;
      border-left: 4px solid #007cba;
    }

    .error {
      border-left-color: #d32f2f;
    }

    .success {
      border-left-color: #2e7d32;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Test Upload d'Images</h1>

    <h2>Test via JavaScript (comme React)</h2>
    <input type="file" id="imageFile" accept="image/*">
    <button onclick="testUpload()">Tester Upload</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <script>
    function testUpload() {
      const fileInput = document.getElementById('imageFile');
      const resultDiv = document.getElementById('result');

      if (!fileInput.files[0]) {
        alert('Veuillez sélectionner une image');
        return;
      }

      const formData = new FormData();
      formData.append('image', fileInput.files[0]);

      resultDiv.style.display = 'block';
      resultDiv.className = 'result';
      resultDiv.innerHTML = 'Upload en cours...';

      fetch('test-upload-simple.php', {
        method: 'POST',
        body: formData
      })
        .then(response => response.json())
        .then(data => {
          console.log('Réponse:', data);

          if (data.success) {
            resultDiv.className = 'result success';
            resultDiv.innerHTML = `
                    <h3>✅ Upload réussi !</h3>
                    <p><strong>URL:</strong> ${data.url}</p>
                    <p><strong>Fichier:</strong> ${data.file_path}</p>
                    <p><strong>Taille:</strong> ${data.file_size_saved} bytes</p>
                    <img src="${data.url}" style="max-width: 200px; margin-top: 10px;" alt="Image uploadée">
                `;
          } else {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `
                    <h3>❌ Erreur d'upload</h3>
                    <p><strong>Erreur:</strong> ${data.error}</p>
                    <details>
                        <summary>Détails techniques</summary>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </details>
                `;
          }
        })
        .catch(error => {
          console.error('Erreur:', error);
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
                <h3>❌ Erreur réseau</h3>
                <p>${error.message}</p>
            `;
        });
    }
  </script>
</body>

</html>
