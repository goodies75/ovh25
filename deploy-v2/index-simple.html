<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test - Collection de Comics</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .comics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .comic-card {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
      backdrop-filter: blur(10px);
    }

    .comic-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .comic-info {
      margin: 5px 0;
    }

    .error {
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid red;
      padding: 10px;
      border-radius: 5px;
      margin: 20px 0;
    }

    .loading {
      text-align: center;
      font-size: 1.2em;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>📚 Collection de Comics</h1>
      <p>Explorez et gérez votre collection complète</p>
    </div>

    <div id="status" class="loading">Chargement des comics...</div>
    <div id="comics-container" class="comics-grid"></div>
  </div>

  <script>
    async function loadComics() {
      const statusDiv = document.getElementById('status');
      const containerDiv = document.getElementById('comics-container');

      try {
        console.log('Tentative de chargement des comics...');
        const response = await fetch('./get-fiches.php');

        if (!response.ok) {
          throw new Error(`Erreur HTTP: ${response.status}`);
        }

        const comics = await response.json();
        console.log('Comics reçus:', comics);

        if (!comics || comics.length === 0) {
          statusDiv.innerHTML = '<div class="error">Aucun comic trouvé</div>';
          return;
        }

        statusDiv.innerHTML = `${comics.length} comic(s) trouvé(s)`;

        containerDiv.innerHTML = comics.map(comic => `
                    <div class="comic-card">
                        <div class="comic-title">${comic.titre || comic.nom_serie || 'Titre inconnu'}</div>
                        <div class="comic-info"><strong>Numéro:</strong> ${comic.numero || 'N/A'}</div>
                        <div class="comic-info"><strong>Année:</strong> ${comic.annee || 'N/A'}</div>
                        <div class="comic-info"><strong>Éditeur:</strong> ${comic.editeur || 'N/A'}</div>
                        <div class="comic-info"><strong>État:</strong> ${comic.etat || 'N/A'}</div>
                        ${comic.description ? `<div class="comic-info"><strong>Description:</strong> ${comic.description}</div>` : ''}
                    </div>
                `).join('');

      } catch (error) {
        console.error('Erreur:', error);
        statusDiv.innerHTML = `<div class="error">Erreur de chargement: ${error.message}</div>`;
      }
    }

    // Charger les comics au démarrage
    document.addEventListener('DOMContentLoaded', loadComics);
  </script>
</body>

</html>
